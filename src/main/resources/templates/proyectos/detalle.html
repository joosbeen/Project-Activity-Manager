<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${proyecto.nombre} + ' - Kanban'">Kanban - Project Activity Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container-fluid mt-4 px-md-4">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <section class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-wrap gap-3 justify-content-between align-items-center">
                <div>
                    <div class="d-flex align-items-center gap-2">
                        <h1 class="h3 mb-0" th:text="${proyecto.nombre}">Proyecto</h1>
                        <span class="badge"
                              th:classappend="${proyecto.estado == T(com.josben.tarea.enums.EstadoProyecto).PROCESO ? ' bg-success' : proyecto.estado == T(com.josben.tarea.enums.EstadoProyecto).PENDIENTE ? ' bg-warning text-dark' : proyecto.estado == T(com.josben.tarea.enums.EstadoProyecto).DETENIDO ? ' bg-danger' : ' bg-secondary'}"
                              th:text="${proyecto.estado}"></span>
                    </div>
                    <p class="text-muted mb-0 mt-1" th:text="${proyecto.descripcion} ?: 'Sin descripción'"></p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/proyectos}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Proyectos</a>
                    <a th:href="@{/tareas/nuevo/{proyectoId}(proyectoId=${proyecto.id})}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nueva tarea</a>
                </div>
            </div>
        </section>

        <div class="row g-3 pb-4">
            <div class="col-12 col-md-6 col-xl-3">
                <section class="card h-100 border-info">
                    <div class="card-header bg-info text-dark d-flex justify-content-between"><strong>Abierto</strong><span class="badge bg-dark" th:text="${tareasAbiertas.size()}">0</span></div>
                    <div class="card-body bg-body-secondary" th:replace="~{fragments/kanban :: tarjetas(${tareasAbiertas}, ${proyecto.id})}"></div>
                </section>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
                <section class="card h-100 border-success">
                    <div class="card-header bg-success text-white d-flex justify-content-between"><strong>Proceso</strong><span class="badge bg-dark" th:text="${tareasEnProceso.size()}">0</span></div>
                    <div class="card-body bg-body-secondary" th:replace="~{fragments/kanban :: tarjetas(${tareasEnProceso}, ${proyecto.id})}"></div>
                </section>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
                <section class="card h-100 border-danger">
                    <div class="card-header bg-danger text-white d-flex justify-content-between"><strong>Detenido</strong><span class="badge bg-dark" th:text="${tareasDetenidas.size()}">0</span></div>
                    <div class="card-body bg-body-secondary" th:replace="~{fragments/kanban :: tarjetas(${tareasDetenidas}, ${proyecto.id})}"></div>
                </section>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
                <section class="card h-100 border-secondary">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between"><strong>Cerrado</strong><span class="badge bg-dark" th:text="${tareasCerradas.size()}">0</span></div>
                    <div class="card-body bg-body-secondary" th:replace="~{fragments/kanban :: tarjetas(${tareasCerradas}, ${proyecto.id})}"></div>
                </section>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

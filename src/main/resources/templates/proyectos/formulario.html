<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${proyecto.id != null ? 'Editar Proyecto' : 'Nuevo Proyecto'} + ' - Project Activity Manager'">Proyecto - Project Activity Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${proyecto.id != null ? 'Editar Proyecto' : 'Nuevo Proyecto'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="${proyecto.id != null ? '/proyectos/actualizar/' + proyecto.id : '/proyectos/guardar'}" 
                              th:method="${proyecto.id != null ? 'post' : 'post'}">
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="nombre" 
                                       name="nombre" 
                                       th:value="${proyecto.nombre}"
                                       required
                                       maxlength="100">
                                <div class="form-text">El nombre es obligatorio y debe ser único.</div>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" 
                                          id="descripcion" 
                                          name="descripcion" 
                                          rows="4" 
                                          maxlength="500"
                                          th:text="${proyecto.descripcion}"></textarea>
                                <div class="form-text">Máximo 500 caracteres.</div>
                            </div>

                            <div class="mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <select class="form-select" 
                                        id="estado" 
                                        name="estado">
                                    <option th:each="estado : ${estados}" 
                                            th:value="${estado}" 
                                            th:text="${estado}" 
                                            th:selected="${proyecto.estado != null && proyecto.estado == estado}"></option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/proyectos" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 
                                    <span th:text="${proyecto.id != null ? 'Actualizar' : 'Guardar'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tarea.id != null ? 'Editar Tarea' : 'Nueva Tarea'} + ' - Project Activity Manager'">Tarea - Project Activity Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${tarea.id != null ? 'Editar Tarea' : 'Nueva Tarea'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="${tarea.id != null ? '/tareas/actualizar/' + tarea.id : '/tareas/guardar'}" 
                              th:method="${tarea.id != null ? 'post' : 'post'}"
                              th:object="${tarea}">
                            
                            <input type="hidden" name="proyectoId" th:value="${proyectoId}">
                            
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="titulo" 
                                       th:field="*{titulo}"
                                       required
                                       maxlength="200">
                                <div class="form-text">El título es obligatorio. Máximo 200 caracteres.</div>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" 
                                          id="descripcion" 
                                          th:field="*{descripcion}"
                                          rows="4" 
                                          maxlength="1000"></textarea>
                                <div class="form-text">Máximo 1000 caracteres.</div>
                            </div>

                            <div class="mb-3">
                                <label for="prioridad" class="form-label">Prioridad</label>
                                <select class="form-select" 
                                        id="prioridad" 
                                        th:field="*{prioridad}">
                                    <option th:each="prioridad : ${prioridades}" 
                                            th:value="${prioridad}" 
                                            th:text="${prioridad}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <select class="form-select" 
                                        id="estado" 
                                        th:field="*{estado}">
                                    <option th:each="estado : ${estados}" 
                                            th:value="${estado}" 
                                            th:text="${estado}"></option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/proyectos/detalle/{id}(id=${proyectoId})}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 
                                    <span th:text="${tarea.id != null ? 'Actualizar' : 'Guardar'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección de comentarios - solo visible al editar -->
        <div th:if="${tarea.id != null}" class="row mt-4">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h4>Comentarios</h4>
                    </div>
                    <div class="card-body">
                        <!-- Formulario para agregar nuevo comentario -->
                        <form th:action="@{/comentarios/guardar}" th:method="post" th:object="${nuevoComentario}" class="mb-4">
                            <input type="hidden" name="tareaId" th:value="${tarea.id}">
                            
                            <div class="mb-3">
                                <label for="comentarioTitulo" class="form-label">Título del Comentario *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="comentarioTitulo" 
                                       th:field="*{titulo}"
                                       required
                                       maxlength="200">
                            </div>

                            <div class="mb-3">
                                <label for="comentarioDescripcion" class="form-label">Descripción del Comentario</label>
                                <textarea class="form-control" 
                                          id="comentarioDescripcion" 
                                          th:field="*{descripcion}"
                                          rows="3" 
                                          maxlength="1000"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="comentarioEstado" class="form-label">Estado</label>
                                <select class="form-select" 
                                        id="comentarioEstado" 
                                        th:field="*{estado}">
                                    <option th:each="estado : ${estadosComentario}" 
                                            th:value="${estado}" 
                                            th:text="${estado}"></option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-plus-circle"></i> Agregar Comentario
                            </button>
                        </form>

                        <hr>

                        <!-- Lista de comentarios existentes -->
                        <div th:if="${comentarios.empty}" class="alert alert-info">
                            <i class="bi bi-info-circle"></i> No hay comentarios en esta tarea.
                        </div>

                        <div th:if="${!comentarios.empty}">
                            <div class="list-group">
                                <div th:each="comentario : ${comentarios}" class="list-group-item">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div class="flex-grow-1">
                                            <h5 class="mb-1" th:text="${comentario.titulo}">Título del comentario</h5>
                                            <p class="mb-1" th:text="${comentario.descripcion}">Descripción del comentario</p>
                                            <small class="text-muted">
                                                <i class="bi bi-calendar"></i> 
                                                <span th:text="${#temporals.format(comentario.fecha, 'dd/MM/yyyy')}"></span>
                                            </small>
                                            <span class="badge ms-2" 
                                                  th:class="'badge ' + ${comentario.estado == T(com.josben.tarea.enums.EstadoComentario).CERRADO ? 'bg-secondary' : 
                                                                  comentario.estado == T(com.josben.tarea.enums.EstadoComentario).PROCESO ? 'bg-success' : 'bg-info'}"
                                                  th:text="${comentario.estado}"></span>
                                        </div>
                                        <div class="btn-group-vertical ms-3">
                                            <div class="dropdown">
                                                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                                    <i class="bi bi-gear"></i> Estado
                                                </button>
                                                <ul class="dropdown-menu">
                                                    <li th:each="estado : ${estadosComentario}">
                                                        <a class="dropdown-item" 
                                                           th:href="@{/comentarios/cambiar-estado/{id}(id=${comentario.id}, estado=${estado}, tareaId=${tarea.id})}"
                                                           th:text="${estado}"></a>
                                                    </li>
                                                </ul>
                                            </div>
                                            <a th:href="@{/comentarios/eliminar/{id}(id=${comentario.id}, tareaId=${tarea.id})}" 
                                               class="btn btn-sm btn-outline-danger mt-1"
                                               onclick="return confirm('¿Está seguro de eliminar este comentario?')"
                                               title="Eliminar">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
